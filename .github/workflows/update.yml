name: Оновлення ноутбуків з Telegram

on:
  push:
    paths:
      - build_catalog.py
      - .github/workflows/update.yml
  schedule:
    - cron: "0 6 * * *"      # щодня о 06:00 UTC (~09:00 за Києвом)
  workflow_dispatch: {}       # кнопка «Run workflow» для ручного запуску

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Встановити залежності
        run: pip install requests beautifulsoup4 pillow

      - name: Зібрати ноутбуки
        run: python build_catalog.py

      - name: Опублікувати зміни
        run: |
          git config user.name "okservice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Змін немає — нічого не публікую."
          else
            git commit -m "Авто-оновлення каталогу ноутбуків"
            git push
          fi
