name: Оновлення ноутбуків з Telegram

on:
  push:
    paths:
      - build_catalog.py
      - .github/workflows/update.yml
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Встановити залежності
        run: pip install requests beautifulsoup4
      - name: Зібрати ноутбуки + завантажити фото
        run: python build_catalog.py
      - name: Опублікувати зміни
        run: |
          git config user.name "okservice-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A index.html img
          if git diff --cached --quiet; then
            echo "Змін немає."
          else
            git commit -m "Авто-оновлення каталогу + фото"
            git push
          fi
